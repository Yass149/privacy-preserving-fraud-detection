[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Fail on unregistered markers rather than silently ignoring a typo in one.
addopts =
    --strict-markers
    --tb=short
    -ra

markers =
    requires_gpu: needs a CUDA GPU with RAPIDS/cuDF (skipped elsewhere)
    requires_artifacts: needs trained checkpoints or metrics JSON present

filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
